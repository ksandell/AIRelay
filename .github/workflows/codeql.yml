name: CodeQL

# Runs on merge to main only. No schedule, no pull_request — CI is a release
# gate here, not a per-push service, and scans that fire on their own burn
# Actions minutes we would rather spend on releases. Dispatch manually to scan
# any branch on demand.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (javascript)
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` is broader than the default `security`
          # query suite — surfaces maintainability findings too. Cheap on a
          # small JS codebase.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
